name: avocetta
description: >-
  Deterministic linter for agent skills and plugins — spec, Claude Code, and
  Codex compliance, with inline PR annotations.
author: korya
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Path to lint (a skill, plugin, marketplace, or repo root)
    required: false
    default: "."
  dialect:
    description: >-
      Comma-separated dialects (spec, claude, codex, all, or name@version).
      Default: spec dialects plus auto-detected vendor dialects.
    required: false
    default: ""
  strict:
    description: Treat warnings as errors
    required: false
    default: "false"
  pedantic:
    description: Enable opinion-tier warnings
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Lint agent skills and plugins
      shell: bash
      run: |
        args=(--format github)
        # `[ cond ] && args+=(...)` returns non-zero when the test fails, which
        # fails the whole step under `bash -e` if it is ever the last line.
        if [ -n "${{ inputs.dialect }}" ]; then
          args+=(--dialect "${{ inputs.dialect }}")
        fi
        if [ "${{ inputs.strict }}" = "true" ]; then
          args+=(--strict)
        fi
        if [ "${{ inputs.pedantic }}" = "true" ]; then
          args+=(--pedantic)
        fi
        node "${{ github.action_path }}/dist/cli.js" "${args[@]}" "${{ inputs.path }}"
